name: Windows fork checks

on:
  push:
    branches: [windows-enhancements]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-ci.yml'
  pull_request:
    branches: [windows-enhancements]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-fork-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The tests run the TypeScript sources directly, which needs Node 22.18
      # or newer; 24 is the version they are run with locally.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: windows-ci-cargo-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: windows-ci-cargo-

      - name: Install dependencies
        run: npm ci
      - name: Frontend build
        run: npm run build
      - name: Upstream feature checks
        run: npm test
      - name: Codex behavior checks
        run: npm run test:codex
      - name: Rust tests
        run: cargo test --locked --workspace --lib --bins
      - name: Native production build
        run: npm run tauri -- build --no-bundle
