name: Windows fork checks

on:
  push:
    branches: [windows-enhancements]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-ci.yml'
  pull_request:
    branches: [windows-enhancements]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-fork-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Frontend build
        run: npm run build
      - name: Codex behavior checks
        run: npm run test:codex
      - name: Rust tests
        run: cargo test --locked --workspace --lib --bins
      - name: Native production build
        run: npm run tauri -- build --no-bundle
